id = "workspace.enhancer"
name = "Workspace Enhancer"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Workspace notes and archive/restore manager"
platforms = ["linux", "windows"]

[[build]]
command = ["go", "build", "-o", "bin/", "./cmd/herdr-workspace-enhancer"]

[[actions]]
id = "open"
title = "Workspace notes and archives"
contexts = ["workspace"]
command = ["./bin/herdr-workspace-enhancer", "--open"]

[[panes]]
id = "manager"
title = "Workspace Enhancer"
placement = "tab"
command = ["./bin/herdr-workspace-enhancer"]

[[events]]
on = "workspace.created"
command = ["./bin/herdr-workspace-enhancer", "--sync"]

[[events]]
on = "workspace.closed"
command = ["./bin/herdr-workspace-enhancer", "--sync"]

[[events]]
on = "workspace.renamed"
command = ["./bin/herdr-workspace-enhancer", "--sync"]
