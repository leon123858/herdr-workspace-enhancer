name: Test and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o bin/ ./cmd/herdr-workspace-enhancer
      - name: Linux terminal smoke test
        if: runner.os == 'Linux'
        run: python3 scripts/tui_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-enhancer-${{ matrix.os }}
          path: |
            bin/
            herdr-plugin.toml
            README.md
